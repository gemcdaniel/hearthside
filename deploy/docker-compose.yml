services:
  hearthside:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - 8082:8080
    volumes:
      - hearthside_data:/data
    environment:
      HEARTHSIDE_ADDR: ':8080'
      HEARTHSIDE_DB_PATH: '/data/hearthside.db'
      HEARTHSIDE_WEB_DIR: '/srv/web'
      HEARTHSIDE_PUBLIC_BASE_URL: '${HEARTHSIDE_PUBLIC_BASE_URL:-http://localhost:8080}'
      HEARTHSIDE_COOKIE_SECURE: '${HEARTHSIDE_COOKIE_SECURE:-false}'
      HEARTHSIDE_LOG_LEVEL: '${HEARTHSIDE_LOG_LEVEL:-info}'
      HEARTHSIDE_BOOTSTRAP_TOKEN: '${HEARTHSIDE_BOOTSTRAP_TOKEN:-}'
      HEARTHSIDE_OIDC_ISSUER_URL: '${HEARTHSIDE_OIDC_ISSUER_URL:-}'
      HEARTHSIDE_OIDC_CLIENT_ID: '${HEARTHSIDE_OIDC_CLIENT_ID:-}'
      HEARTHSIDE_OIDC_CLIENT_SECRET: '${HEARTHSIDE_OIDC_CLIENT_SECRET:-}'
      HEARTHSIDE_OIDC_PROVIDER_NAME: '${HEARTHSIDE_OIDC_PROVIDER_NAME:-}'
      HEARTHSIDE_OIDC_SCOPES: '${HEARTHSIDE_OIDC_SCOPES:-}'
      HEARTHSIDE_PUZZLE_SCHEDULER_ENABLED: '${HEARTHSIDE_PUZZLE_SCHEDULER_ENABLED:-true}'
      HEARTHSIDE_PUZZLE_POOL_TARGET: '${HEARTHSIDE_PUZZLE_POOL_TARGET:-50}'
      HEARTHSIDE_PUZZLE_POOL_LOW_WATER: '${HEARTHSIDE_PUZZLE_POOL_LOW_WATER:-20}'
      HEARTHSIDE_PUZZLE_POOL_MAX_TOTAL: '${HEARTHSIDE_PUZZLE_POOL_MAX_TOTAL:-2000}'
      HEARTHSIDE_DAILY_LOOKAHEAD_DAYS: '${HEARTHSIDE_DAILY_LOOKAHEAD_DAYS:-7}'
    healthcheck:
      test: ['CMD', '/server', '-healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
