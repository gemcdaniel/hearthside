name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Bun + TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  go:
    name: Go (Engine + API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - name: Go vet
        run: go vet ./engine/sudoku/... ./services/api/...

      - name: Go test
        run: go test -race ./engine/sudoku/... ./services/api/...

      - name: Verify Sudoku engine WASM build
        working-directory: engine/sudoku
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Build WASM artifacts and manifest
        run: sh scripts/build-wasm.sh

      - name: Lint engine/sudoku
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: engine/sudoku
          args: --config ../../.golangci.yml

      - name: Lint services/api
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: services/api
          args: --config ../../.golangci.yml
