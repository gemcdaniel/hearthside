<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Hearthside</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f8f6f2;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f9fafb;
        }
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        border: 1px solid #94a3b8;
        border-radius: 0.75rem;
        text-align: center;
      }
      button {
        margin-top: 1rem;
        min-height: 44px;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-weight: 600;
        border: 2px solid #0284c7;
        border-radius: 0.5rem;
        background: #1d4ed8;
        color: #ffffff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>This page is not yet cached for offline play. Reconnect once or retry below.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
